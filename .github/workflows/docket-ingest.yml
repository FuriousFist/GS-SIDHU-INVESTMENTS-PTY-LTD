name: Docket Ingest

on:
  schedule:
    # 20:00 UTC = 6:00am AEST / 7:00am AEDT. Adjust to taste.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to search (use ~60 for a one-off backfill)"
        required: false
        default: "1"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials.yaml
        run: |
          cat > "Email Scraper/credentials.yaml" <<EOF
          user: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          supabase_url: ${{ secrets.SUPABASE_URL }}
          supabase_key: ${{ secrets.SUPABASE_KEY }}
          EOF

      - name: Run docket ingestion
        env:
          DAYS_TO_SEARCH: ${{ github.event.inputs.days || '1' }}
        run: python "Email Scraper/email_scraper_main.py"
